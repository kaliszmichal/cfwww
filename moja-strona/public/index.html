<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#02030a">
  <title>michal.kalisz.pl</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600;700&display=swap" rel="stylesheet">
  <script>
    // Ustaw zapisany motyw zanim strona się narysuje (bez migania). Domyślnie ciemny.
    (function () {
      var t = 'dark';
      try {
        var saved = localStorage.getItem('theme');
        if (saved === 'light' || saved === 'dark') t = saved;
      } catch (e) {}
      document.documentElement.dataset.theme = t;
      document.querySelector('meta[name="theme-color"]').content = t === 'light' ? '#cfe3fa' : '#02030a';
    })();
  </script>
  <style>
    :root {
      --bg-base: #02030a; /* zapas: gdyby tło nie pokryło całego ekranu */
      --bg-grad: radial-gradient(ellipse at 50% 100%, #1b2240 0%, #0a0c1a 55%, #02030a 100%);
      --fg: #fff;
      --btn-bg: #fff;
      --btn-fg: #000;
      --btn-border: #fff;
      --track: rgba(255, 255, 255, 0.2);
      color-scheme: dark;
    }
    :root[data-theme="light"] {
      --bg-base: #cfe3fa;
      --bg-grad: radial-gradient(ellipse at 50% 0%, #fffbea 0%, #d3e5fa 50%, #9fc0ec 100%);
      --fg: #0b1530;
      --btn-bg: #0b1530;
      --btn-fg: #fff;
      --btn-border: #0b1530;
      --track: rgba(11, 21, 48, 0.15);
      color-scheme: light;
    }
    html, body {
      height: 100%;
      margin: 0;
    }
    html {
      background-color: var(--bg-base);
    }
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      height: 100lvh; /* pełna wysokość ekranu telefonu, także pod paskami przeglądarki */
      z-index: -2;
      background: var(--bg-grad);
      pointer-events: none;
    }
    #stars {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      height: 100lvh;
      z-index: -1;
      pointer-events: none;
    }
    #astro {
      position: fixed;
      top: 0;
      left: 0;
      width: clamp(64px, 18vw, 96px);
      z-index: -1; /* nad gwiazdami, pod całą treścią */
      pointer-events: none;
      transform-origin: 50% 50%;
      will-change: transform;
    }
    #astro svg {
      display: block;
      width: 100%;
      height: auto;
      overflow: visible;
    }
    body {
      height: auto;
      min-height: 100%; /* gdy treści jest więcej niż ekranu, strona się przewija */
      background: transparent;
      color: var(--fg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 1.5rem 1rem;
      box-sizing: border-box;
      font-family: "Exo 2",-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    h1 {
      font-size: clamp(1.5rem, 6vw, 3.5rem);
      font-weight: 600;
      letter-spacing: 0.02em;
      margin: 0 0 0.6em;
    }
    button {
      background: var(--btn-bg);
      color: var(--btn-fg);
      border: 1px solid var(--btn-border);
      border-radius: 999px;
      padding: 0.8em 2em;
      font-size: 1.12rem;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }
    #theme-toggle {
      position: fixed;
      top: max(1rem, env(safe-area-inset-top));
      right: max(1rem, env(safe-area-inset-right));
      z-index: 10;
      width: 3rem;
      height: 3rem;
      padding: 0;
      display: grid;
      place-items: center;
      background: transparent;
      color: var(--fg);
    }
    #theme-toggle svg {
      width: 1.4rem;
      height: 1.4rem;
      fill: none;
      stroke: currentColor; /* jednokolorowe ikony w kolorze tekstu */
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    /* ikona pokazuje motyw, na który się przełączysz */
    #theme-toggle .icon-moon { display: none; }
    :root[data-theme="light"] #theme-toggle .icon-sun { display: none; }
    :root[data-theme="light"] #theme-toggle .icon-moon { display: block; }
    @media (hover: hover) {
      #theme-toggle:hover {
        background: var(--btn-bg);
        color: var(--btn-fg);
      }
    }
    #btn, #btn2, #btn3, #btn4 {
      box-sizing: border-box;
      width: min(15.7rem, 100%); /* wszystkie pastylki tej samej szerokości */
    }
    #btn2, #btn3, #btn4 {
      margin-top: 1.6em;
    }
    #menu {
      width: min(15.7rem, 100%);
      display: flex;
      flex-direction: column;
      gap: 0.7rem;
      max-height: 0;
      overflow: hidden;
      opacity: 0;
      visibility: hidden;
      transition: max-height 0.4s ease, opacity 0.3s, margin-top 0.4s, visibility 0s 0.4s;
    }
    #menu.open {
      max-height: 16rem;
      margin-top: 0.9rem;
      opacity: 1;
      visibility: visible;
      transition: max-height 0.4s ease, opacity 0.3s, margin-top 0.4s, visibility 0s;
    }
    #menu button {
      box-sizing: border-box;
      width: 100%;
      background: transparent;
      color: var(--fg);
      font-size: 0.92rem;
      padding: 0.7em 1.5em;
    }
    #menu button:hover {
      background: var(--btn-bg);
      color: var(--btn-fg);
    }
    #btn4::after {
      content: " ▾";
      display: inline-block;
      transition: transform 0.3s;
    }
    #btn4[aria-expanded="true"]::after {
      transform: rotate(180deg);
    }
    #btn {
      animation: float 3s ease-in-out infinite;
      transition: background 0.4s, color 0.4s, border-color 0.4s, box-shadow 0.4s;
    }
    #btn.done {
      background: #2ecc71;
      border-color: #2ecc71;
      color: #04210f;
      box-shadow: 0 0 28px rgba(46, 204, 113, 0.75);
    }
    #progress {
      box-sizing: border-box;
      width: min(15.7rem, 100%);
      height: 10px;
      margin-top: 1rem;
      border-radius: 999px;
      background: var(--track);
      overflow: hidden;
      transition: box-shadow 0.4s;
    }
    #progress[hidden] {
      display: none;
    }
    #progress-fill {
      width: 0%;
      height: 100%;
      border-radius: 999px;
      background: var(--btn-bg);
      transition: background 0.4s;
    }
    #progress.done {
      box-shadow: 0 0 18px rgba(46, 204, 113, 0.75);
    }
    #progress.done #progress-fill {
      background: #2ecc71;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    @media (prefers-reduced-motion: reduce) {
      #btn { animation: none; }
    }
    p {
      font-size: clamp(1rem, 3vw, 1.5rem);
      margin: 1em 0 0;
      opacity: 0;
      transition: opacity 0.6s;
    }
    p.visible {
      opacity: 0.8;
    }
    p[hidden] {
      display: none;
    }
    #pin-form {
      display: flex;
      gap: 0.5em;
      margin-top: 1.6em;
      width: min(15.7rem, 100%); /* tak samo szeroko jak przyciski */
    }
    #pin-form button {
      width: auto;
      padding: 0.8em 1.4em;
    }
    #pin-form[hidden] {
      display: none;
    }
    #pin {
      flex: 1;
      min-width: 0;
      box-sizing: border-box;
      background: transparent;
      color: var(--fg);
      border: 1px solid var(--btn-border);
      border-radius: 999px;
      padding: 0.8em 1em;
      font-size: 1.12rem;
      font-family: inherit;
      text-align: center;
      letter-spacing: 0.3em;
    }
    #pin.error {
      border-color: #f66;
      animation: shake 0.3s;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }
    #secret {
      font-size: clamp(1rem, 3vw, 1.5rem);
      margin: 1em 0 0;
      opacity: 1; /* nadpisuje p { opacity: 0 } */
    }
    #secret[hidden] {
      display: none;
    }
    #moon {
      font-size: clamp(4rem, 18vw, 9rem);
      line-height: 1;
      margin-top: 0.3em;
      opacity: 0;
      transition: opacity 0.6s;
    }
    #moon.visible {
      opacity: 1;
    }
    #moon[hidden] {
      display: none;
    }
  </style>
</head>
<body>
  <canvas id="stars" aria-hidden="true"></canvas>
  <div id="astro" aria-hidden="true">
    <svg viewBox="0 -12 100 124" fill="none" stroke="#0b1530" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
      <!-- antena -->
      <path d="M50 5 V-3"/>
      <circle cx="50" cy="-5" r="3" fill="#ff7a45"/>
      <!-- plecak -->
      <rect x="20" y="42" width="60" height="42" rx="12" fill="#c5cde0"/>
      <!-- nogi (jedna kopie w powietrzu) -->
      <rect x="31" y="78" width="16" height="28" rx="8" fill="#f2f4f8" transform="rotate(14 39 80)"/>
      <rect x="54" y="78" width="16" height="28" rx="8" fill="#f2f4f8" transform="rotate(-24 62 80)"/>
      <rect x="29" y="98" width="20" height="9" rx="4.5" fill="#ff7a45" stroke="none" transform="rotate(14 39 80)"/>
      <rect x="52" y="98" width="20" height="9" rx="4.5" fill="#ff7a45" stroke="none" transform="rotate(-24 62 80)"/>
      <!-- ręce: jedna pomachająca w górę, druga zwisa -->
      <rect x="6" y="30" width="26" height="14" rx="7" fill="#f2f4f8" transform="rotate(-52 26 40)"/>

      <circle cx="45" cy="64.5" r="2.3" fill="#ff7a45" stroke="none"/>

      <!-- hełm -->
      <circle cx="50" cy="29" r="27" fill="#f2f4f8"/>

      <path d="M41 35.5 Q50 45 59 35.5 Z" fill="#fff" stroke="none"/>

    </svg>
  </div>
  <button id="theme-toggle" type="button" aria-label="Przełącz na tryb jasny">
    <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="12" cy="12" r="4"/>
      <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
    </svg>
    <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
    </svg>
  </button>
  <button id="btn" type="button">KLIKNIJ MNIE</button>
  <div id="progress" role="progressbar" aria-label="Ładowanie" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" hidden>
    <div id="progress-fill"></div>
  </div>
  <button id="btn2" type="button">DRUGI PRZYCISK</button>
  <div id="moon" hidden aria-label="Księżyc" role="img">🌙</div>
  <button id="btn3" type="button">KLIK</button>
  <form id="pin-form" hidden autocomplete="off">
    <input id="pin" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" placeholder="PIN" aria-label="PIN (4 cyfry)" required>
    <button type="submit">OK</button>
  </form>
  <p id="secret" hidden aria-live="polite"></p>
  <button id="btn4" type="button" aria-expanded="false" aria-controls="menu">MENU</button>
  <div id="menu" role="group" aria-label="Menu">
    <button type="button">Wybór 1</button>
    <button type="button">Wybór 2</button>
    <button type="button">Wybór 3</button>
  </div>

  <script>
    // Gwiazdy w tle: trzy warstwy (paralaksa), powolny dryf i delikatne mruganie.
    (function () {
      const canvas = document.getElementById('stars');
      const ctx = canvas.getContext('2d');
      const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      let w, h, stars = [];

      function init() {
        const dpr = window.devicePixelRatio || 1;
        w = canvas.clientWidth || window.innerWidth;
        h = canvas.clientHeight || window.innerHeight;
        canvas.width = w * dpr;
        canvas.height = h * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        const count = Math.round((w * h) / 6000);
        stars = Array.from({ length: count }, () => {
          const layer = Math.random();            // 0 = daleko, 1 = blisko
          return {
            x: Math.random() * w,
            y: Math.random() * h,
            r: 0.4 + layer * 1.3,
            speed: 0.03 + layer * 0.12,           // piksele na klatkę
            base: 0.35 + layer * 0.55,
            phase: Math.random() * Math.PI * 2,
            tw: 0.4 + Math.random() * 1.2
          };
        });
      }

      function draw(t) {
        ctx.clearRect(0, 0, w, h);
        for (const s of stars) {
          if (!reduce) {
            s.x -= s.speed;
            s.y += s.speed * 0.25;
            if (s.x < -2) s.x = w + 2;
            if (s.y > h + 2) s.y = -2;
          }
          const a = reduce ? s.base : s.base * (0.7 + 0.3 * Math.sin(t / 1000 * s.tw + s.phase));
          // w jasnym motywie białe gwiazdy byłyby niewidoczne - używamy granatowych, słabszych
          const light = document.documentElement.dataset.theme === 'light';
          ctx.globalAlpha = light ? a * 0.5 : a;
          ctx.fillStyle = light ? '#2a4a8f' : '#fff';
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
        if (!reduce) requestAnimationFrame(draw);
      }

      init();
      window.addEventListener('resize', () => {
        // na telefonie resize odpala się też przy chowaniu pasków przeglądarki
        if (canvas.clientWidth === w && canvas.clientHeight === h) return;
        init();
        if (reduce) draw(0);
      });
      // przy ograniczonym ruchu nie ma pętli animacji, więc po zmianie motywu rysujemy ponownie
      window.addEventListener('themechange', () => { if (reduce) draw(0); });
      requestAnimationFrame(draw);
    })();

    // Astronauta dryfuje po całym ekranie i odbija się od krawędzi (z lekkim "spłaszczeniem" i nową rotacją).
    (function () {
      const astro = document.getElementById('astro');
      const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const W = () => document.documentElement.clientWidth;
      const H = () => window.innerHeight;
      const rand = (a, b) => a + Math.random() * (b - a);

      let x = rand(0, Math.max(0, W() - astro.offsetWidth));
      let y = rand(0, Math.max(0, H() - astro.offsetHeight));
      const speed = rand(42, 62); // piksele na sekundę
      const angle = rand(0.3, Math.PI / 2 - 0.3) + Math.floor(rand(0, 4)) * (Math.PI / 2);
      let vx = Math.cos(angle) * speed;
      let vy = Math.sin(angle) * speed;
      let rot = rand(-20, 20);
      let vr = (Math.random() < 0.5 ? -1 : 1) * rand(10, 22); // stopnie na sekundę
      let squash = 0, hitX = false;
      let last = performance.now();

      function render() {
        const sq = hitX ? [1 - 0.28 * squash, 1 + 0.2 * squash] : [1 + 0.2 * squash, 1 - 0.28 * squash];
        astro.style.transform =
          `translate3d(${x.toFixed(1)}px, ${y.toFixed(1)}px, 0) scale(${sq[0].toFixed(3)}, ${sq[1].toFixed(3)}) rotate(${rot.toFixed(1)}deg)`;
      }

      function bounce(alongX, dir) {
        // odbicie z lekką zmianą kierunku, żeby trasa się nie powtarzała
        const sp = Math.hypot(vx, vy);
        let a = Math.atan2(vy, vx) + rand(-0.35, 0.35);
        vx = Math.cos(a) * sp;
        vy = Math.sin(a) * sp;
        if (alongX) vx = dir * Math.abs(vx); else vy = dir * Math.abs(vy);
        vr = (Math.random() < 0.5 ? -1 : 1) * rand(10, 30);
        squash = 1;
        hitX = alongX;
      }

      function step(now) {
        const dt = Math.min((now - last) / 1000, 0.05);
        last = now;
        const maxX = Math.max(0, W() - astro.offsetWidth);
        const maxY = Math.max(0, H() - astro.offsetHeight);
        x += vx * dt;
        y += vy * dt;
        if (x < 0) { x = 0; bounce(true, 1); }
        else if (x > maxX) { x = maxX; bounce(true, -1); }
        if (y < 0) { y = 0; bounce(false, 1); }
        else if (y > maxY) { y = maxY; bounce(false, -1); }
        rot += vr * dt;
        squash *= Math.exp(-dt * 7);
        render();
        requestAnimationFrame(step);
      }

      if (reduce) {
        // bez ruchu: astronauta po prostu wisi w rogu
        x = W() * 0.7; y = H() * 0.2; rot = -12;
        render();
      } else {
        render();
        requestAnimationFrame(step);
      }
    })();

    // Przełącznik motywu: ciemny (domyślny) / jasny, zapamiętywany w przeglądarce.
    const root = document.documentElement;
    const themeToggle = document.getElementById('theme-toggle');
    const themeMeta = document.querySelector('meta[name="theme-color"]');

    function applyTheme(theme, save) {
      const light = theme === 'light';
      root.dataset.theme = theme;
      themeMeta.content = light ? '#cfe3fa' : '#02030a';
      // ikonę (słońce/księżyc) przełącza CSS według data-theme
      themeToggle.setAttribute('aria-label', light ? 'Przełącz na tryb ciemny' : 'Przełącz na tryb jasny');
      if (save) {
        try { localStorage.setItem('theme', theme); } catch (e) {}
      }
      window.dispatchEvent(new Event('themechange'));
    }

    themeToggle.addEventListener('click', () => {
      applyTheme(root.dataset.theme === 'light' ? 'dark' : 'light', true);
    });
    applyTheme(root.dataset.theme === 'light' ? 'light' : 'dark', false);

    const btn = document.getElementById('btn');

    const progress = document.getElementById('progress');
    const fill = document.getElementById('progress-fill');
    const BTN_LABEL = btn.textContent;
    const LOAD_MS = 2500;
    let loading = false;

    btn.addEventListener('click', () => {
      if (loading) return;
      loading = true;
      btn.classList.remove('done');
      btn.textContent = BTN_LABEL;
      progress.classList.remove('done');
      progress.hidden = false;
      fill.style.width = '0%';
      progress.setAttribute('aria-valuenow', '0');

      const start = performance.now();
      function step(now) {
        const p = Math.min((now - start) / LOAD_MS, 1);
        fill.style.width = (p * 100).toFixed(1) + '%';
        progress.setAttribute('aria-valuenow', String(Math.round(p * 100)));
        if (p < 1) {
          requestAnimationFrame(step);
        } else {
          // 100% - zapal się na zielono
          btn.classList.add('done');
          progress.classList.add('done');
          btn.textContent = 'OK';
          loading = false;
        }
      }
      requestAnimationFrame(step);
    });

    const btn2 = document.getElementById('btn2');
    const moon = document.getElementById('moon');

    btn2.addEventListener('click', () => {
      moon.hidden = false;
      requestAnimationFrame(() => moon.classList.add('visible'));
      btn2.hidden = true;
    });

    // Sekretna wiadomość jest zaszyfrowana (AES-GCM, klucz z PIN-u przez PBKDF2),
    // więc nie ma jej w kodzie strony jako zwykłego tekstu.
    const SECRET = {
      s: 'F5L/9jBcCUgGT0UinaF/Aw==',
      i: 'xYFEnjxQufvUMOeG',
      c: 'Bh0Ws+J+z2ByRjhkcnHy59CyWANh8nipKhDr2bpWdUSqwsa81B928f0vcoPM0swpYwEFC6Ev5fi8nWCd7PwSAV/KLnC8k2I='
    };
    const b64 = (s) => Uint8Array.from(atob(s), (ch) => ch.charCodeAt(0));

    async function decryptSecret(pin) {
      const enc = new TextEncoder();
      const base = await crypto.subtle.importKey('raw', enc.encode(pin), 'PBKDF2', false, ['deriveKey']);
      const key = await crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt: b64(SECRET.s), iterations: 200000, hash: 'SHA-256' },
        base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']
      );
      const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(SECRET.i) }, key, b64(SECRET.c));
      return new TextDecoder().decode(plain);
    }

    const btn4 = document.getElementById('btn4');
    const menu = document.getElementById('menu');

    btn4.addEventListener('click', () => {
      const open = menu.classList.toggle('open');
      btn4.setAttribute('aria-expanded', String(open));
    });

    const btn3 = document.getElementById('btn3');
    const pinForm = document.getElementById('pin-form');
    const pinInput = document.getElementById('pin');
    const secret = document.getElementById('secret');

    btn3.addEventListener('click', () => {
      pinForm.hidden = false;
      btn3.hidden = true;
      pinInput.focus();
    });

    pinForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        secret.textContent = await decryptSecret(pinInput.value);
        secret.hidden = false;
        pinForm.hidden = true;
      } catch (err) {
        pinInput.classList.remove('error');
        void pinInput.offsetWidth; // restart animacji
        pinInput.classList.add('error');
        pinInput.select();
      }
    });
  </script>
</body>
</html>
