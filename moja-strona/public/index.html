<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>michal.kalisz.pl</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
    }
    body {
      background: #000;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 0 1rem;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    h1 {
      font-size: clamp(1.5rem, 6vw, 3.5rem);
      font-weight: 600;
      letter-spacing: 0.02em;
      margin: 0 0 0.6em;
    }
    button {
      background: transparent;
      color: #fff;
      border: 1px solid #fff;
      border-radius: 999px;
      padding: 0.6em 1.4em;
      font-size: 1rem;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }
    button:hover {
      background: #fff;
      color: #000;
    }
    #btn2, #btn3 {
      margin-top: 1.6em;
    }
    #btn {
      animation: float 3s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    @media (prefers-reduced-motion: reduce) {
      #btn { animation: none; }
    }
    p {
      font-size: clamp(1rem, 3vw, 1.5rem);
      margin: 1em 0 0;
      opacity: 0;
      transition: opacity 0.6s;
    }
    p.visible {
      opacity: 0.8;
    }
    p[hidden] {
      display: none;
    }
    #pin-form {
      display: flex;
      gap: 0.5em;
      margin-top: 1.6em;
    }
    #pin-form[hidden] {
      display: none;
    }
    #pin {
      width: 5.5em;
      background: transparent;
      color: #fff;
      border: 1px solid #fff;
      border-radius: 999px;
      padding: 0.6em 1em;
      font-size: 1rem;
      font-family: inherit;
      text-align: center;
      letter-spacing: 0.3em;
    }
    #pin.error {
      border-color: #f66;
      animation: shake 0.3s;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }
    #secret {
      font-size: clamp(1rem, 3vw, 1.5rem);
      margin: 1em 0 0;
      opacity: 1; /* nadpisuje p { opacity: 0 } */
    }
    #secret[hidden] {
      display: none;
    }
    #moon {
      font-size: clamp(4rem, 18vw, 9rem);
      line-height: 1;
      margin-top: 0.3em;
      opacity: 0;
      transition: opacity 0.6s;
    }
    #moon.visible {
      opacity: 1;
    }
    #moon[hidden] {
      display: none;
    }
  </style>
</head>
<body>
  <h1>michal.kalisz.pl Cześć</h1>
  <button id="btn" type="button">KLIKNIJ MNIE</button>
  <button id="btn2" type="button">DRUGI PRZYCISK</button>
  <p id="msg" hidden> :) Działa!</p>
  <div id="moon" hidden aria-label="Księżyc" role="img">🌙</div>
  <button id="btn3" type="button">SEKRET</button>
  <form id="pin-form" hidden autocomplete="off">
    <input id="pin" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" placeholder="PIN" aria-label="PIN (4 cyfry)" required>
    <button type="submit">OK</button>
  </form>
  <p id="secret" hidden aria-live="polite"></p>

  <script>
    const btn = document.getElementById('btn');
    const msg = document.getElementById('msg');

    btn.addEventListener('click', () => {
      msg.hidden = false;
      // krótkie opóźnienie, żeby animacja opacity zadziałała
      requestAnimationFrame(() => msg.classList.add('visible'));
      btn.hidden = true;
    });

    const btn2 = document.getElementById('btn2');
    const moon = document.getElementById('moon');

    btn2.addEventListener('click', () => {
      moon.hidden = false;
      requestAnimationFrame(() => moon.classList.add('visible'));
      btn2.hidden = true;
    });

    // Sekretna wiadomość jest zaszyfrowana (AES-GCM, klucz z PIN-u przez PBKDF2),
    // więc nie ma jej w kodzie strony jako zwykłego tekstu.
    const SECRET = {
      s: 'F5L/9jBcCUgGT0UinaF/Aw==',
      i: 'xYFEnjxQufvUMOeG',
      c: 'Bh0Ws+J+z2ByRjhkcnHy59CyWANh8nipKhDr2bpWdUSqwsa81B928f0vcoPM0swpYwEFC6Ev5fi8nWCd7PwSAV/KLnC8k2I='
    };
    const b64 = (s) => Uint8Array.from(atob(s), (ch) => ch.charCodeAt(0));

    async function decryptSecret(pin) {
      const enc = new TextEncoder();
      const base = await crypto.subtle.importKey('raw', enc.encode(pin), 'PBKDF2', false, ['deriveKey']);
      const key = await crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt: b64(SECRET.s), iterations: 200000, hash: 'SHA-256' },
        base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']
      );
      const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(SECRET.i) }, key, b64(SECRET.c));
      return new TextDecoder().decode(plain);
    }

    const btn3 = document.getElementById('btn3');
    const pinForm = document.getElementById('pin-form');
    const pinInput = document.getElementById('pin');
    const secret = document.getElementById('secret');

    btn3.addEventListener('click', () => {
      pinForm.hidden = false;
      btn3.hidden = true;
      pinInput.focus();
    });

    pinForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        secret.textContent = await decryptSecret(pinInput.value);
        secret.hidden = false;
        pinForm.hidden = true;
      } catch (err) {
        pinInput.classList.remove('error');
        void pinInput.offsetWidth; // restart animacji
        pinInput.classList.add('error');
        pinInput.select();
      }
    });
  </script>
</body>
</html>
