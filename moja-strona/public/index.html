<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>michal.kalisz.pl</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
    }
    body {
      background: #000;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 0 1rem;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    h1 {
      font-size: clamp(1.5rem, 6vw, 3.5rem);
      font-weight: 600;
      letter-spacing: 0.02em;
      margin: 0 0 0.6em;
    }
    button {
      background: transparent;
      color: #fff;
      border: 1px solid #fff;
      border-radius: 999px;
      padding: 0.6em 1.4em;
      font-size: 1rem;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }
    button:hover {
      background: #fff;
      color: #000;
    }
    p {
      font-size: clamp(1rem, 3vw, 1.5rem);
      margin: 1em 0 0;
      opacity: 0;
      transition: opacity 0.6s;
    }
    p.visible {
      opacity: 0.8;
    }
    p[hidden] {
      display: none;
    }
  </style>
</head>
<body>
  <h1>michal.kalisz.pl Cześć</h1>
  <button id="btn" type="button">KLIKNIJ MNIE</button>
  <p id="msg" hidden>i LoVe You M <3</p>

  <script>
    const btn = document.getElementById('btn');
    const msg = document.getElementById('msg');

    btn.addEventListener('click', () => {
      msg.hidden = false;
      // krótkie opóźnienie, żeby animacja opacity zadziałała
      requestAnimationFrame(() => msg.classList.add('visible'));
      btn.hidden = true;
    });
  </script>
</body>
</html>
