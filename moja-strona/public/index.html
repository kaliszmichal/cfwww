<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#02030a">
  <title>michal.kalisz.pl</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    html, body {
      height: 100%;
      margin: 0;
    }
    html {
      background-color: #02030a; /* zapas: gdyby tło nie pokryło całego ekranu */
      color-scheme: dark;
    }
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      height: 100lvh; /* pełna wysokość ekranu telefonu, także pod paskami przeglądarki */
      z-index: -2;
      background: radial-gradient(ellipse at 50% 100%, #1b2240 0%, #0a0c1a 55%, #02030a 100%);
      pointer-events: none;
    }
    #stars {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      height: 100lvh;
      z-index: -1;
      pointer-events: none;
    }
    body {
      background: transparent;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 0 1rem;
      box-sizing: border-box;
      font-family: "Exo 2",-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    h1 {
      font-size: clamp(1.5rem, 6vw, 3.5rem);
      font-weight: 600;
      letter-spacing: 0.02em;
      margin: 0 0 0.6em;
    }
    button {
      background: #fff;
      color: #000;
      border: 1px solid #fff;
      border-radius: 999px;
      padding: 0.8em 2em;
      font-size: 1.4rem;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }
    button:hover {
      background: transparent;
      color: #fff;
    }
    #btn2, #btn3 {
      margin-top: 1.6em;
    }
    #btn {
      animation: float 3s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    @media (prefers-reduced-motion: reduce) {
      #btn { animation: none; }
    }
    p {
      font-size: clamp(1rem, 3vw, 1.5rem);
      margin: 1em 0 0;
      opacity: 0;
      transition: opacity 0.6s;
    }
    p.visible {
      opacity: 0.8;
    }
    p[hidden] {
      display: none;
    }
    #pin-form {
      display: flex;
      gap: 0.5em;
      margin-top: 1.6em;
    }
    #pin-form[hidden] {
      display: none;
    }
    #pin {
      width: 6em;
      background: transparent;
      color: #fff;
      border: 1px solid #fff;
      border-radius: 999px;
      padding: 0.8em 1em;
      font-size: 1.4rem;
      font-family: inherit;
      text-align: center;
      letter-spacing: 0.3em;
    }
    #pin.error {
      border-color: #f66;
      animation: shake 0.3s;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }
    #secret {
      font-size: clamp(1rem, 3vw, 1.5rem);
      margin: 1em 0 0;
      opacity: 1; /* nadpisuje p { opacity: 0 } */
    }
    #secret[hidden] {
      display: none;
    }
    #moon {
      font-size: clamp(4rem, 18vw, 9rem);
      line-height: 1;
      margin-top: 0.3em;
      opacity: 0;
      transition: opacity 0.6s;
    }
    #moon.visible {
      opacity: 1;
    }
    #moon[hidden] {
      display: none;
    }
  </style>
</head>
<body>
  <canvas id="stars" aria-hidden="true"></canvas>
  <button id="btn" type="button">KLIKNIJ MNIE</button>
  <button id="btn2" type="button">DRUGI PRZYCISK</button>
  <p id="msg" hidden> :) Działa!</p>
  <div id="moon" hidden aria-label="Księżyc" role="img">🌙</div>
  <button id="btn3" type="button">SEKRET</button>
  <form id="pin-form" hidden autocomplete="off">
    <input id="pin" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" placeholder="PIN" aria-label="PIN (4 cyfry)" required>
    <button type="submit">OK</button>
  </form>
  <p id="secret" hidden aria-live="polite"></p>

  <script>
    // Gwiazdy w tle: trzy warstwy (paralaksa), powolny dryf i delikatne mruganie.
    (function () {
      const canvas = document.getElementById('stars');
      const ctx = canvas.getContext('2d');
      const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      let w, h, stars = [];

      function init() {
        const dpr = window.devicePixelRatio || 1;
        w = canvas.clientWidth || window.innerWidth;
        h = canvas.clientHeight || window.innerHeight;
        canvas.width = w * dpr;
        canvas.height = h * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        const count = Math.round((w * h) / 6000);
        stars = Array.from({ length: count }, () => {
          const layer = Math.random();            // 0 = daleko, 1 = blisko
          return {
            x: Math.random() * w,
            y: Math.random() * h,
            r: 0.4 + layer * 1.3,
            speed: 0.03 + layer * 0.12,           // piksele na klatkę
            base: 0.35 + layer * 0.55,
            phase: Math.random() * Math.PI * 2,
            tw: 0.4 + Math.random() * 1.2
          };
        });
      }

      function draw(t) {
        ctx.clearRect(0, 0, w, h);
        for (const s of stars) {
          if (!reduce) {
            s.x -= s.speed;
            s.y += s.speed * 0.25;
            if (s.x < -2) s.x = w + 2;
            if (s.y > h + 2) s.y = -2;
          }
          const a = reduce ? s.base : s.base * (0.7 + 0.3 * Math.sin(t / 1000 * s.tw + s.phase));
          ctx.globalAlpha = a;
          ctx.fillStyle = '#fff';
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
        if (!reduce) requestAnimationFrame(draw);
      }

      init();
      window.addEventListener('resize', () => {
        // na telefonie resize odpala się też przy chowaniu pasków przeglądarki
        if (canvas.clientWidth === w && canvas.clientHeight === h) return;
        init();
        if (reduce) draw(0);
      });
      requestAnimationFrame(draw);
    })();

    const btn = document.getElementById('btn');
    const msg = document.getElementById('msg');

    btn.addEventListener('click', () => {
      msg.hidden = false;
      // krótkie opóźnienie, żeby animacja opacity zadziałała
      requestAnimationFrame(() => msg.classList.add('visible'));
      btn.hidden = true;
    });

    const btn2 = document.getElementById('btn2');
    const moon = document.getElementById('moon');

    btn2.addEventListener('click', () => {
      moon.hidden = false;
      requestAnimationFrame(() => moon.classList.add('visible'));
      btn2.hidden = true;
    });

    // Sekretna wiadomość jest zaszyfrowana (AES-GCM, klucz z PIN-u przez PBKDF2),
    // więc nie ma jej w kodzie strony jako zwykłego tekstu.
    const SECRET = {
      s: 'F5L/9jBcCUgGT0UinaF/Aw==',
      i: 'xYFEnjxQufvUMOeG',
      c: 'Bh0Ws+J+z2ByRjhkcnHy59CyWANh8nipKhDr2bpWdUSqwsa81B928f0vcoPM0swpYwEFC6Ev5fi8nWCd7PwSAV/KLnC8k2I='
    };
    const b64 = (s) => Uint8Array.from(atob(s), (ch) => ch.charCodeAt(0));

    async function decryptSecret(pin) {
      const enc = new TextEncoder();
      const base = await crypto.subtle.importKey('raw', enc.encode(pin), 'PBKDF2', false, ['deriveKey']);
      const key = await crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt: b64(SECRET.s), iterations: 200000, hash: 'SHA-256' },
        base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']
      );
      const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(SECRET.i) }, key, b64(SECRET.c));
      return new TextDecoder().decode(plain);
    }

    const btn3 = document.getElementById('btn3');
    const pinForm = document.getElementById('pin-form');
    const pinInput = document.getElementById('pin');
    const secret = document.getElementById('secret');

    btn3.addEventListener('click', () => {
      pinForm.hidden = false;
      btn3.hidden = true;
      pinInput.focus();
    });

    pinForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        secret.textContent = await decryptSecret(pinInput.value);
        secret.hidden = false;
        pinForm.hidden = true;
      } catch (err) {
        pinInput.classList.remove('error');
        void pinInput.offsetWidth; // restart animacji
        pinInput.classList.add('error');
        pinInput.select();
      }
    });
  </script>
</body>
</html>
